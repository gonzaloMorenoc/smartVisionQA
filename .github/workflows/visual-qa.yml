name: Visual QA (with AI)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama vision model
        default: qwen2.5vl:3b
        type: string
      publish_results:
        description: Publish reports to GitHub Pages
        default: true
        type: boolean
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

permissions:
  contents: read

concurrency:
  group: visual-qa
  cancel-in-progress: false

env:
  SVQA_MODEL: ${{ inputs.model || 'qwen2.5vl:3b' }}

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      ollama:
        image: ollama/ollama:0.40.18
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - run: python -m playwright install --with-deps chromium
      - name: Pull model
        run: |
          curl -fsS --retry 5 --retry-connrefused http://localhost:11434/api/version
          curl -fsS http://localhost:11434/api/pull -d "{\"model\": \"${SVQA_MODEL}\", \"stream\": false}"
      - name: Run visual checks
        id: run
        env:
          LINK_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set +e
          smartvisionqa run --config smartvisionqa.yaml --model "$SVQA_MODEL" --link-base "$LINK_BASE"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # The demo pages differ on purpose: 1 (regressions) is expected, 2 is a real error.
          test "$code" -ne 2
      - name: Evaluate the model on known mutations
        run: smartvisionqa evaluate --model "$SVQA_MODEL" --output results/evaluation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-qa-results
          path: results/
          retention-days: 30
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'schedule' || inputs.publish_results
        with:
          path: results/

  deploy:
    needs: analyse
    if: github.event_name == 'schedule' || inputs.publish_results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
