[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smartvisionqa"
version = "1.0.0"
description = "Hybrid visual regression testing: deterministic pixel diff + local vision-model explanations via Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gonzalo Moreno" }]
keywords = ["qa", "visual-regression", "testing", "playwright", "ollama", "vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.49,<2",
    "pillow>=10.4",
    "numpy>=1.26",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "jinja2>=3.1.4",
    "ollama>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[project.scripts]
smartvisionqa = "smartvisionqa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartvisionqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers -m 'not ai' --cov=smartvisionqa --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: needs a real Chromium (Playwright) but no AI model",
    "ai: needs a running Ollama server with a vision model",
]

[tool.coverage.run]
branch = true
source = ["smartvisionqa"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RET", "PTH", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S311"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["smartvisionqa"]

[[tool.mypy.overrides]]
module = ["ollama.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
