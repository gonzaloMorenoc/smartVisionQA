# Reproducible local/CI run with a separate Ollama service.
#   docker compose run --rm smartvisionqa                 # demo config
#   docker compose run --rm smartvisionqa compare A B     # any CLI command
# Override the model with SVQA_MODEL=qwen2.5vl:3b docker compose run --rm smartvisionqa
services:
  ollama:
    image: ollama/ollama:0.40.18
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  model:
    image: ollama/ollama:0.40.18
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${SVQA_MODEL:-qwen2.5vl:7b}"]
    restart: "no"

  smartvisionqa:
    build: .
    depends_on:
      model:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
      SVQA_MODEL: ${SVQA_MODEL:-qwen2.5vl:7b} # read by the CLI for every command
    volumes:
      - ./results:/app/results
      - ./baselines:/app/baselines
    command: ["run", "--config", "smartvisionqa.yaml"]

volumes:
  ollama-models:
